name: Production Deploy Dummy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: kvizcommando-production
  cancel-in-progress: false

jobs:
  deploy-dummy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KVIZ_VM_SSH_KEY }}" > ~/.ssh/kvizcommando_deploy
          chmod 600 ~/.ssh/kvizcommando_deploy
          ssh-keyscan -H 68.210.99.129 >> ~/.ssh/known_hosts

      - name: Start dummy server release
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/kvizcommando_deploy \
            -o IdentitiesOnly=yes \
            kcadmin@68.210.99.129 \
            "sudo /usr/local/sbin/kvizcommando-deploy '${GITHUB_REF_NAME}'"
